# Render Blueprint: one-click deploy of AirWise as a free web service.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: airwise
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Secrets: Render prompts for these on first deploy (never commit them).
      # Claude is used when ANTHROPIC_API_KEY is set; Gemini otherwise.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY_BACKUP
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_BACKUP
        sync: false
